name: create-containers-img
on:
  schedule:
    - cron: '5 15 * * *'   # 21:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      # space-separated folders; order maps to secrets IG_TOKEN_1..IG_TOKEN_10 and IG_USER_1..IG_USER_10
      MP4_DIRS: "ts"   # change to your folders
      BRANCH: main

      IG_TOKEN_1: ${{ secrets.IG_TS_AT }}
      IG_TOKEN_2: ${{ secrets.IG_LL_AT }}
      IG_TOKEN_3: ${{ secrets.IG_TOKEN_3 }}
      IG_TOKEN_4: ${{ secrets.IG_TOKEN_4 }}
      IG_TOKEN_5: ${{ secrets.IG_TOKEN_5 }}
      IG_TOKEN_6: ${{ secrets.IG_TOKEN_6 }}
      IG_TOKEN_7: ${{ secrets.IG_TOKEN_7 }}
      IG_TOKEN_8: ${{ secrets.IG_TOKEN_8 }}
      IG_TOKEN_9: ${{ secrets.IG_TOKEN_9 }}
      IG_TOKEN_10: ${{ secrets.IG_TOKEN_10 }}

      IG_USER_1:  ${{ secrets.IG_TS_UN }}
      IG_USER_2:  ${{ secrets.IG_LL_UN }}
      IG_USER_3:  ${{ secrets.IG_USER_3 }}
      IG_USER_4:  ${{ secrets.IG_USER_4 }}
      IG_USER_5:  ${{ secrets.IG_USER_5 }}
      IG_USER_6:  ${{ secrets.IG_USER_6 }}
      IG_USER_7:  ${{ secrets.IG_USER_7 }}
      IG_USER_8:  ${{ secrets.IG_USER_8 }}
      IG_USER_9:  ${{ secrets.IG_USER_9 }}
      IG_USER_10: ${{ secrets.IG_USER_10 }}

    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y jq coreutils

      - name: create containers and save json
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          IFS=' ' read -r -a DIRS <<< "${MP4_DIRS}"

          for idx in "${!DIRS[@]}"; do
            i=$((idx+1))
            FOLDER="${DIRS[idx]}"
            echo "---- account $i -> folder: $FOLDER ----"

            # pick PNG instead of MP4
            FILES=$(git ls-files "${FOLDER}"/*.png 2>/dev/null || true)
            if [ -z "$FILES" ]; then
              echo "no png in ${FOLDER}, skipping"
              continue
            fi

            PICK=$(echo "$FILES" | shuf -n1)
            IMAGE_URL="https://raw.githubusercontent.com/${repo}/${BRANCH}/${PICK}"

            TOKEN_VAR="IG_TOKEN_${i}"
            USER_VAR="IG_USER_${i}"
            IG_ACCESS_TOKEN="${!TOKEN_VAR:-}"
            IG_USER_ID="${!USER_VAR:-}"

            if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$IG_USER_ID" ]; then
              echo "missing secret for index $i, skipping"
              continue
            fi

            BASENAME=$(basename "$PICK")
            NAME_NO_EXT="${BASENAME%.*}"

            # per-image caption file: abc.png -> abc.txt (same folder)
            CAP_FILE="${FOLDER}/${NAME_NO_EXT}.txt"
            if [ -f "$CAP_FILE" ] && [ -s "$CAP_FILE" ]; then
              CAPTION=$(cat "$CAP_FILE")
            else
              # fall back to filename (without extension)
              CAPTION="${NAME_NO_EXT}"
            fi

            # escape caption safely into JSON string (strip surrounding quotes later)
            CAP_ESCAPED=$(printf '%s' "$CAPTION" | jq -Rsa . | sed 's/^"//; s/"$//')

            # create IMAGE container
            RESPONSE=$(curl -s -X POST "https://graph.instagram.com/v23.0/${IG_USER_ID}/media" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${IG_ACCESS_TOKEN}" \
              -d "{\"image_url\":\"${IMAGE_URL}\", \"caption\":\"${CAP_ESCAPED}\"}")

            echo "Create response (trim): $(echo "$RESPONSE" | jq -c '. | {id: .id, error: .error?.message}')"

            CID=$(echo "$RESPONSE" | jq -r '.id // empty')
            if [ -z "$CID" ]; then
              echo "no creation id for ${PICK}; skipping"
              continue
            fi

            # sd/abc.png -> sd/abc.png.container.json
            OUT_JSON="${FOLDER}/${BASENAME}.container.json"
            jq -n --arg id "$CID" --arg file "$PICK" --arg resp "$RESPONSE" \
              '{creation_id:$id, file:$file, response:($resp|fromjson? // $resp)}' > "$OUT_JSON"

            git add "$OUT_JSON"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: add container json for ${PICK}" || echo "no changes to commit"
            git push origin HEAD:${BRANCH} || echo "push failed (non-fatal)"

            echo "Saved container file: $OUT_JSON (creation_id: $CID)"
          done
