name: multi-account-random-upload
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # daily 09:00 UTC (adjust if needed)

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      # multiple folders → each folder = 1 account
      # MP4_DIRS: "sd mp4s_b mp4s_c ..."
      MP4_DIRS: "sd"
      BRANCH: main

      # 10 tokens max (example: IG_SD_AT = token for folder sd)
      IG_TOKEN_1: ${{ secrets.IG_SD_AT }}
      IG_USER_1:  ${{ secrets.IG_SD_UN }}

    steps:
      - uses: actions/checkout@v4

      - name: install jq
        run: sudo apt-get update && sudo apt-get install -y jq coreutils

      - name: upload loop
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          IFS=' ' read -r -a DIRS <<< "${MP4_DIRS}"

          for idx in "${!DIRS[@]}"; do
            i=$((idx+1))
            FOLDER="${DIRS[idx]}"
            echo "----- ACCOUNT $i → FOLDER: $FOLDER -----"

            # pick random mp4
            FILES=$(git ls-files "${FOLDER}"/*.mp4 2>/dev/null || true)
            if [ -z "$FILES" ]; then
              echo "no mp4 in folder: ${FOLDER} — skipping"
              continue
            fi
            PICK=$(echo "$FILES" | shuf -n1)
            VIDEO_URL="https://raw.githubusercontent.com/${repo}/${BRANCH}/${PICK}"

            # load secrets
            TOKEN_VAR="IG_TOKEN_${i}"
            USER_VAR="IG_USER_${i}"
            IG_ACCESS_TOKEN="${!TOKEN_VAR:-}"
            IG_USER_ID="${!USER_VAR:-}"

            if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$IG_USER_ID" ]; then
              echo "missing token or user ID for account $i — skipping"
              continue
            fi

            # pick caption from folder’s captions.txt
            CAPTION_FILE="${FOLDER}/captions.txt"
            if [ -f "$CAPTION_FILE" ] && [ -s "$CAPTION_FILE" ]; then
              CAPTION=$(shuf -n1 "$CAPTION_FILE")
            else
              CAPTION="Auto upload from CI"
            fi

            echo "Random caption selected:"
            echo "$CAPTION"

            # escape caption for JSON
            CAP_ESCAPED=$(printf '%s' "$CAPTION" | jq -Rsa . | sed 's/^"//; s/"$//')

            echo "Creating container…"

            RESPONSE=$(curl -s -X POST "https://graph.instagram.com/v23.0/${IG_USER_ID}/media" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer $IG_ACCESS_TOKEN" \
                  -d "{\"video_url\":\"$VIDEO_URL\", \"media_type\":\"REELS\", \"caption\":\"$CAP_ESCAPED\"}")

            echo "Create response: $RESPONSE"

            CID=$(echo "$RESPONSE" | jq -r '.id // empty')
            if [ -z "$CID" ]; then
              echo "❌ Failed: No container ID"
              continue
            fi

            echo "Publishing container id: $CID"

            PUB=$(curl -s -X POST "https://graph.instagram.com/v23.0/${IG_USER_ID}/media_publish" \
                  -H "Authorization: Bearer $IG_ACCESS_TOKEN" \
                  -d "creation_id=${CID}")

            echo "Publish response: $PUB"

            echo "✔ SUCCESS: Account $i uploaded container $CID"
          done
